<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remark® CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:    #0C0D10;
  --surf:  #13141A;
  --surf2: #1A1C23;
  --surf3: #21242E;
  --gold:  #B8965A;
  --gold2: #CCA96A;
  --gold3: rgba(184,150,90,.1);
  --gold4: rgba(184,150,90,.05);
  --bord:  #25272F;
  --bord2: #2E3040;
  --txt:   #EAECF2;
  --txt2:  #8A8FA8;
  --txt3:  #4E5268;
}
*{box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);margin:0;color:var(--txt)}

/* ── SIDEBAR ── */
.sidebar{width:240px;background:#0E0F14;min-height:100vh;position:fixed;left:0;top:0;z-index:100;display:flex;flex-direction:column;border-right:1px solid var(--bord)}
.logo{font-family:'Helvetica','Arial',sans-serif;color:var(--txt);font-size:18px;font-weight:700;padding:24px 20px 16px;border-bottom:1px solid var(--bord);letter-spacing:-.3px}
.logo small{display:block;font-size:9.5px;font-weight:400;color:var(--txt3);letter-spacing:1.8px;text-transform:uppercase;margin-top:4px;font-family:'Inter',sans-serif}
.logo span{color:var(--gold)}
.nav-sec{padding:20px 20px 5px;font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--txt3)}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 16px;margin:1px 8px;border-radius:7px;color:var(--txt2);cursor:pointer;font-size:13px;transition:all .15s}
.nav-item:hover{color:var(--txt);background:var(--surf2)}
.nav-item.active{color:var(--gold);background:var(--gold3);font-weight:600}
.nav-badge{margin-left:auto;background:var(--gold);color:#0C0D10;border-radius:10px;padding:1px 7px;font-size:10.5px;font-weight:700}

/* ── MAIN ── */
.main{margin-left:240px;min-height:100vh}
.topbar{background:var(--surf);padding:14px 28px;border-bottom:1px solid var(--bord);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;gap:16px}
.pg-title{font-family:'Helvetica','Arial',sans-serif;font-size:18px;color:var(--txt);font-weight:700;letter-spacing:-.3px}
.pg-sub{font-size:11.5px;color:var(--txt3);margin-top:2px}
.content{padding:24px 28px}

/* ── CARDS ── */
.card{background:var(--surf);border-radius:10px;padding:20px;box-shadow:0 1px 8px rgba(0,0,0,.35);border:1px solid var(--bord)}
.kpi{background:var(--surf);border-radius:10px;padding:18px 20px;box-shadow:0 1px 8px rgba(0,0,0,.35);border:1px solid var(--bord);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.kpi-lbl{font-size:10.5px;font-weight:500;letter-spacing:.6px;color:var(--txt3);text-transform:uppercase}
.kpi-val{font-size:28px;font-weight:700;color:var(--txt);line-height:1.2;margin-top:4px}
.kpi-sub{font-size:11.5px;color:var(--txt2);margin-top:3px}
.kpi-ico{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--gold);background:var(--gold3);border:1px solid rgba(184,150,90,.2)}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.bc{background:rgba(16,185,129,.15);color:#34D399;border:1px solid rgba(16,185,129,.2)}
.bx{background:rgba(239,68,68,.12);color:#F87171;border:1px solid rgba(239,68,68,.2)}
.bf{background:rgba(245,158,11,.12);color:#FBBF24;border:1px solid rgba(245,158,11,.2)}
.bn{background:rgba(255,255,255,.06);color:var(--txt2);border:1px solid var(--bord2)}

/* ── TABLE ── */
table{width:100%;border-collapse:collapse}
th{padding:9px 14px;text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--gold);background:var(--surf2);border-bottom:1px solid var(--bord)}
td{padding:11px 14px;font-size:13.5px;color:var(--txt);border-bottom:1px solid var(--bord)}
tr:hover td{background:var(--gold4)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:7px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all .18s;border:none}
.btn-p{background:linear-gradient(135deg,#E8C96A 0%,#C9A84C 50%,#8B6914 100%);color:#111;box-shadow:0 2px 8px rgba(201,168,76,.3)}.btn-p:hover{background:linear-gradient(135deg,#F0D57A 0%,#D4AF60 50%,#9A7820 100%);transform:translateY(-1px);box-shadow:0 4px 14px rgba(201,168,76,.45)}
.btn-s{background:linear-gradient(135deg,rgba(232,201,106,.18) 0%,rgba(201,168,76,.08) 100%);color:var(--gold);border:1px solid rgba(201,168,76,.35)}.btn-s:hover{background:linear-gradient(135deg,rgba(232,201,106,.28) 0%,rgba(201,168,76,.16) 100%);border-color:rgba(201,168,76,.6)}
.btn-wa{background:linear-gradient(135deg,#2EE876 0%,#25D366 60%,#1AAB50 100%);color:#fff;text-decoration:none;box-shadow:0 2px 8px rgba(37,211,102,.25)}.btn-wa:hover{background:linear-gradient(135deg,#3AF082 0%,#1ebe58 60%,#158F3E 100%);transform:translateY(-1px);box-shadow:0 4px 14px rgba(37,211,102,.4)}

/* ── SEARCH & SELECTS ── */
.search{font-family:inherit;background:var(--surf2);border:1px solid var(--bord2);border-radius:8px;padding:8px 14px;font-size:13.5px;color:var(--txt);outline:none;transition:all .2s;height:38px;box-sizing:border-box}
.search:focus{border-color:var(--gold);background:var(--surf3);box-shadow:0 0 0 2px var(--gold4)}
.search::placeholder{color:var(--txt3)}

/* ── CUSTOM DROPDOWN ── */
.c-sel{position:relative;width:155px;user-select:none;font-size:13.2px}
.c-sel-trig{background:var(--surf2);border:1px solid var(--bord2);border-radius:8px;padding:8px 14px;color:var(--txt);cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:all .2s;height:38px;box-sizing:border-box}
.c-sel-trig:hover{border-color:var(--gold)}
.c-sel-trig.open{border-color:var(--gold);background:var(--surf3);box-shadow:0 0 0 2px var(--gold4)}
.c-sel-trig::after{content:'';width:0;height:0;border-left:4.5px solid transparent;border-right:4.5px solid transparent;border-top:5.5px solid var(--gold);margin-left:8px;transition:transform .2s}
.c-sel-trig.open::after{transform:rotate(180deg)}

.c-sel-opts{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surf);border:1px solid var(--bord2);border-radius:12px;overflow:hidden;z-index:200;display:none;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:fadeUp .15s ease-out;border:1px solid rgba(184,150,90,.15)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.c-sel-opt{padding:11px 14px;cursor:pointer;transition:all .15s;color:var(--txt2);font-weight:500}
.c-sel-opt:hover{background:var(--gold3);color:var(--gold)}
.c-sel-opt.active{background:var(--gold);color:#111;font-weight:700}

/* ── SEG CONTROL ── */
.seg{display:flex;background:var(--surf2);border-radius:7px;padding:3px;gap:2px;border:1px solid var(--bord)}
.seg-b{padding:5px 12px;border-radius:5px;font-size:12.5px;font-weight:500;color:var(--txt2);cursor:pointer;border:none;background:none;transition:all .2s}
.seg-b.on{background:var(--gold);color:#000;font-weight:700}

/* ── KANBAN ── */
.kb-scroll-top{overflow-x:auto;overflow-y:hidden;height:10px;margin-bottom:8px}
.kb-scroll-top::-webkit-scrollbar{height:6px}
.kb-scroll-top::-webkit-scrollbar-track{background:var(--surf2);border-radius:3px}
.kb-scroll-top::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}
.kb-scroll-top::-webkit-scrollbar-thumb:hover{background:#b8965a}
.kb-board{display:flex;gap:14px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.kb-board::-webkit-scrollbar{display:none}
.kb-col{min-width:232px;background:var(--surf2);border-radius:10px;padding:10px;border:2px solid var(--bord);transition:all .2s}
.kb-col.dov{background:var(--gold3);border-color:var(--gold)}
.kb-hd{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.kb-cnt{background:var(--gold3);color:var(--gold);border-radius:10px;padding:1px 7px;font-size:10.5px;border:1px solid rgba(201,168,76,.2)}
.kb-card{background:var(--surf);border-radius:8px;padding:11px;margin-bottom:7px;box-shadow:0 2px 8px rgba(0,0,0,.3);border:1px solid var(--bord2);cursor:grab;transition:all .15s}
.kb-card:hover{box-shadow:0 4px 16px rgba(201,168,76,.12);border-color:rgba(201,168,76,.35)}
.kb-card.drag{opacity:.4;transform:scale(.96)}

/* ── REMARKETING CARDS ── */
.rm-card{background:var(--surf);border-radius:10px;padding:14px;border:1px solid var(--bord2);display:flex;align-items:center;gap:14px;margin-bottom:9px;transition:all .2s}
.rm-card:hover{box-shadow:0 4px 16px rgba(201,168,76,.1);border-color:rgba(201,168,76,.3)}
.rm-card.sent{opacity:.45;background:var(--surf2)}

/* ── LEAD INFO MODAL ── */
.lic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.lic-card{background:var(--surf3);border:1px solid var(--bord);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;transition:border-color .2s}
.lic-card:hover{border-color:rgba(184,150,90,.3)}
.lic-ico{width:32px;height:32px;background:var(--gold3);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--gold);flex-shrink:0}
.lic-det{flex:1;min-width:0}
.lic-lbl{font-size:9.5px;font-weight:700;color:var(--txt3);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.lic-val{font-size:13px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lic-val input{background:transparent;border:none;border-bottom:1px solid var(--bord2);color:var(--txt);font-size:13px;font-weight:600;width:100%;outline:none;padding:0}
.lic-val input:focus{border-bottom-color:var(--gold)}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--surf3);color:var(--txt);padding:12px 20px;border-radius:8px;font-size:13.5px;z-index:9999;transform:translateY(70px);opacity:0;transition:all .3s;pointer-events:none;border:1px solid var(--gold);box-shadow:0 4px 20px rgba(201,168,76,.2)}
.toast.show{transform:translateY(0);opacity:1}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:var(--surf);border-radius:16px;padding:28px;max-width:500px;width:92%;max-height:88vh;overflow-y:auto;border:1px solid var(--bord2);box-shadow:0 8px 40px rgba(0,0,0,.6)}
.modal-title{font-family:'Helvetica','Arial',sans-serif;font-size:19px;color:var(--gold);font-weight:700;margin-bottom:6px}
.ctx-item{padding:7px 12px;border-radius:6px;cursor:pointer;color:var(--txt2);display:flex;align-items:center;gap:9px;transition:background .1s;white-space:nowrap}
.ctx-item:hover{background:var(--surf3);color:var(--txt)}
.ctx-item.danger{color:#F87171}.ctx-item.danger:hover{background:rgba(239,68,68,.1)}
.ctx-sep{height:1px;background:var(--bord);margin:4px 0}

/* ── MISC ── */
.empty{text-align:center;padding:56px 20px;color:var(--txt3)}
.empty-ico{font-size:44px;margin-bottom:14px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--surf)}
::-webkit-scrollbar-thumb{background:var(--bord2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--gold3)}
.spin{width:30px;height:30px;border:3px solid var(--bord2);border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
input[type=checkbox]{accent-color:var(--gold)}
</style>
</head>

function fn(nome){
  if(!nome) return 'paciente';
  const p = nome.trim().split(' ')[0];
  return p.charAt(0).toUpperCase()+p.slice(1).toLowerCase();
}

function fmtPhone(p){
  if(!p) return '';
  const d = p.replace(/\D/g,'');
  return d.length>=10 ? (d.startsWith('55')?d:'55'+d) : '';
}

function getInitials(n){
  if(!n) return '?';
  const p=n.trim().split(' ').filter(x=>x.length>1);
  if(p.length===0) return n.trim()[0]?.toUpperCase()||'?';
  if(p.length===1) return p[0].substring(0,2).toUpperCase();
  return (p[0][0]+p[p.length-1][0]).toUpperCase();
}

function waUrl(phone,msg){
  const n = fmtPhone(phone);
  return n ? `https://wa.me/${n}?text=${encodeURIComponent(msg)}` : '#';
}

function parseDate(s){
  if(!s) return null;
  const [d,m,y]=s.split('/');
  return new Date(`${y}-${m}-${d}`);
}

function daysSince(s){
  const d=parseDate(s); if(!d) return 9999;
  return Math.floor((Date.now()-d)/(864e5));
}

function fmtDate(s){
  if(!s) return '–';
  const d=parseDate(s); if(!d) return s;
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});
}

function fmtDateTime(s,hora){
  if(!s) return '–';
  const d=parseDate(s); if(!d) return s;
  const dt=d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});
  return hora?`${dt} às ${hora}`:dt;
}

function timeAgo(s){
  const d=parseDate(s); if(!d) return '?';
  const diff=Date.now()-d.getTime();
  const mins=Math.floor(diff/60000);
  const hrs=Math.floor(diff/3600000);
  const days=Math.floor(diff/864e5);
  const months=Math.floor(days/30.44);
  const years=Math.floor(days/365.25);
  if(mins<60) return `${mins}min`;
  if(hrs<24) return `${hrs}h`;
  if(days<30) return `${days} dias`;
  if(months<12){
    const rem=days-Math.floor(months*30.44);
    return rem>0?`${months} ${months===1?'mês':'meses'} e ${rem}d`:`${months} ${months===1?'mês':'meses'}`;
  }
  const remM=months-years*12;
  return remM>0?`${years} ${years===1?'ano':'anos'} e ${remM} ${remM===1?'mês':'meses'}`:`${years} ${years===1?'ano':'anos'}`;
}

}

function copyTxt(txt){
  if(navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(txt).then(() => {
      toast('✅ Mensagem copiada!');
    }).catch(() => fallbackCopy(txt));
  } else {
    fallbackCopy(txt);
  }
}

function fallbackCopy(txt) {
  const ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.position = 'fixed';
  ta.style.top = '0';
  ta.style.left = '0';
  ta.style.opacity = '0';
  ta.style.pointerEvents = 'none';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    toast('✅ Mensagem copiada!');
  } catch(e) {
    toast('⚠️ Erro ao copiar');
  } finally {
    document.body.removeChild(ta);
  }
}

async function sbSave(){
  const now=localStorage.getItem('nc_updated')||new Date().toISOString();
  try{
    const rows=localStorage.getItem('nc_rows')||'[]';
    
    const vConf = { ...S.voucherConfig, _sys: {
      notes: S.notes,
      stages: S.stages,
      waConfig: S.waConfig,
      rows: rows
    }};

    const payload={
      id:'natuclinic',
      kanban: JSON.stringify(S.kanban),
      rmk_sent: JSON.stringify(S.rmkSent),
      birthdates: JSON.stringify(S.birthdates),
      vouchers: JSON.stringify(S.vouchers),
      voucher_config: JSON.stringify(vConf),
      updated_at: now
    };
    
    const {error}=await SB.from('crm_state').upsert(payload,{onConflict:'id'});
    if(!error){
      localStorage.setItem('nc_sb_ts',now);
      toast('☁️ Salvo');
      return;
    }
    
    // Tenta sem updated_at caso a tabela original não tenha
    const {error:err2}=await SB.from('crm_state').upsert({...payload, updated_at:undefined},{onConflict:'id'});
    if(!err2){
      localStorage.setItem('nc_sb_ts',now);
      toast('☁️ Salvo');
      return;
    }
    console.warn('sbSave failed:', err2.message);
    toast('⚠️ Falha ao salvar na nuvem');
  }catch(e){
    toast('⚠️ Supabase offline');
    console.warn('Supabase offline:',e.message);
  }
}

async function loadPersist(){
  let sbData=null;
  try{
    const {data,error}=await SB.from('crm_state').select('*').eq('id','natuclinic').single();
    if(!error&&data) sbData=data;
    else if(error) console.warn('Supabase load error:',error.message);
  }catch(e){ console.warn('Supabase offline:',e.message); }

  const localTs=localStorage.getItem('nc_updated');
  const sbTs=localStorage.getItem('nc_sb_ts');
  const sbUpdated=sbData?.updated_at;

  let preferLocal=false;
  if(localTs && (!sbTs || new Date(localTs) > new Date(sbTs))){
    preferLocal=true; // Local has unsaved changes
  }
  if(sbUpdated && localTs && new Date(sbUpdated) > new Date(localTs)){
    preferLocal=false; // Supabase has newer changes than local
  }

  const getS=(key,sbKey)=>preferLocal
    ?(localStorage.getItem('nc_'+key)??sbData?.[sbKey||key])
    :(sbData?.[sbKey||key]??localStorage.getItem('nc_'+key));

  try{
    const k=getS('kanban'); if(k) S.kanban=typeof k==='string'?JSON.parse(k):k;
    const r=getS('rmk','rmk_sent'); if(r) S.rmkSent=typeof r==='string'?JSON.parse(r):r;
    const b=getS('bday','birthdates'); if(b) S.birthdates=typeof b==='string'?JSON.parse(b):b;
    const v=getS('vouchers'); if(v) S.vouchers=typeof v==='string'?JSON.parse(v):v;
    
    const vc=getS('vconfig','voucher_config'); 
    let sysData = null;
    if(vc) {
      let parsed = typeof vc==='string'?JSON.parse(vc):vc;
      if(parsed && parsed._sys) {
        sysData = parsed._sys;
        delete parsed._sys; // clean it from app state
      }
      S.voucherConfig = parsed;
    }

    const wc = sysData?.waConfig ?? getS('waconfig','wa_config'); if(wc) S.waConfig=typeof wc==='string'?JSON.parse(wc):wc;
    const nts = sysData?.notes ?? getS('notes'); if(nts) S.notes=typeof nts==='string'?JSON.parse(nts):nts;
    const st = sysData?.stages ?? getS('stages'); if(st) S.stages=typeof st==='string'?JSON.parse(st):st;
    if(!Array.isArray(S.stages)||!S.stages.length) S.stages=JSON.parse(JSON.stringify(DEFAULT_STAGES));
    
    // Especial para pacientes:
    let p = null;
    if(!preferLocal && sysData?.rows) {
      p = sysData.rows; // Cloud is newer and has packed rows
    } else {
      p = preferLocal 
        ? (localStorage.getItem('nc_rows') ?? sbData?.patients_raw ?? sysData?.rows) 
        : (sbData?.patients_raw ?? sysData?.rows ?? localStorage.getItem('nc_rows'));
    }
      
    if(p){
      if(p !== localStorage.getItem('nc_rows')) localStorage.setItem('nc_rows',p);
      S.patients=buildPatients(typeof p==='string'?JSON.parse(p):p);
    }
  }catch(e){ console.error('Load error:',e); }
}

function fixEnc(s){
  return s
    .replace(/Ã§/g,'ç').replace(/Ã£/g,'ã').replace(/Ã¡/g,'á').replace(/Ã©/g,'é')
    .replace(/Ã³/g,'ó').replace(/Ãº/g,'ú').replace(/Ã­/g,'í').replace(/Ã‡/g,'Ç')
    .replace(/Ã•/g,'Õ').replace(/Ã‚/g,'Â').replace(/Ã‰/g,'É').replace(/Ã"/g,'Ó')

    .replace(/Ã»/g,'û').replace(/Ã«/g,'ë').replace(/Ã¯/g,'ï');

function csvSplitLine(line, sep){
  const cols=[]; let cur='', inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){ inQ=!inQ; }
    else if(ch===sep&&!inQ){ cols.push(cur); cur=''; }
    else{ cur+=ch; }
  }
  cols.push(cur);
  return cols;
}

function parseCSV(txt){
  // Normalize ALL line endings to \n first — critical for CRLF files
  txt=txt.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const lines=txt.split('\n').filter(l=>l.trim());
  if(lines.length<2) return [];
  // Detect separator by counting on header
  const firstLine=lines[0];
  const sep=firstLine.split(',').length>=firstLine.split(';').length?',':';';
  // Detect windows-1252 mojibake (only when file read with wrong encoding)
  const needsFix=firstLine.includes('Ã')||firstLine.includes('â€');
  const fix=s=>needsFix?fixEnc(s):s;
  const hdr=csvSplitLine(firstLine,sep).map(h=>fix(h.trim()));
  console.log('CSV sep='+JSON.stringify(sep)+' cols='+hdr.length+' hdr[4]='+hdr[4]);
  return lines.slice(1).map(l=>{
    const cols=csvSplitLine(l,sep).map(c=>fix(c.trim()));
    const row={};
    hdr.forEach((h,i)=>{ row[h]=cols[i]||''; });
    return row;
  }).filter(r=>r['Paciente']&&r['Paciente'].trim());
}

function buildPatients(rows){
  const map=new Map();
  rows.forEach(r=>{
    const raw=r['Paciente']||'';
    const m=raw.match(/^(\d+)\s*-\s*(.+)$/);
    if(!m) return;
    const id=m[1], nome=m[2].trim();
    if(!map.has(id)){
      map.set(id,{id,nome,
        cpf:r['CPF']||'',
        tel:r['Telefone']||'',
        email:r['Email']||'',
        atend:[]});
    }
    const p=map.get(id);
    if(!p.tel && r['Telefone']) p.tel=r['Telefone'];
    if(!p.email && r['Email']) p.email=r['Email'];
    p.atend.push({
      data:r['Data do agendamento']||'',
      hora:r['Hora']||'',
      tipo:r['Tipo de Atendimento']||'',
      status:r['Status']||'',
      medico:r['Médico']||r['Médico']||'',
    });
  });
  const pts=Array.from(map.values());
  pts.forEach(p=>{
    p.atend.sort((a,b)=>{const da=parseDate(a.data),db=parseDate(b.data);return(db||0)-(da||0);});
    p.last=p.atend[0]||null;
    p.total=p.atend.length;
    p.stage=S.kanban[p.id]||autoStage(p);
  });
  return pts.sort((a,b)=>{
    const da=a.last?parseDate(a.last.data):null;
    const db=b.last?parseDate(b.last.data):null;
    return (db||0)-(da||0);
  });
}

function rmkCat(tipo,status){
  // Normaliza para ASCII para não depender de encoding correto do CSV
  const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 -]/g,'');
  const t=norm(tipo), s=norm(status);
  if(s==='cancelou'||s==='cancelado') return 'cancelou';
  if(s==='faltou') return 'faltou';
  if(s==='nao confirmado'||s==='nao-confirmado') return 'ortomol'; // trata como procedimento
  if(t.includes('botox')) return 'botox';
  if(t.includes('harmoniz')) return 'harmoniz';
  if(t.includes('intra-articular')||t.includes('intraarticular')) return 'intrart';
  if(t.includes('ortomolecular')||t.includes('consulta')) return 'ortomol';
  if(t.includes('retorno')) return 'retorno';
  if(t.includes('ozonio')||t.includes('ozonioterapia')) return 'ozonio';
  if(t.includes('reabilit')) return 'reab';
  if(t.includes('injetavel')||t.includes('vitamina')||t.includes('adek')||
     t.includes('trio')||t.includes('pool')||t.includes('chronic')||
     t.includes('pisk')||t.includes('beg')||t.includes('enzima')) return 'injet';
  if(t.includes('estetica')||t.includes('limpeza')||t.includes('avalia')||
     t.includes('spa')||t.includes('lipocrio')||t.includes('protocolo')) return 'estetica';
  return 'ortomol';
}

// ─── IMPORT ───────────────────────────────────────────────────────────────────
// Chave de deduplicação por ID do paciente + data + hora (ignora variações de nome)
function rowKey(r){
  const raw=r['Paciente']||'';
  const m=raw.match(/^(\d+)/);
  const pid=m?m[1]:raw.trim().toLowerCase();
  return `${pid}|${(r['Data do agendamento']||'').trim()}|${(r['Hora']||'').trim()}`;
}

function mergeRows(existing, incoming){
  const seen=new Set(existing.map(rowKey));
  let added=0;
  incoming.forEach(r=>{
    const k=rowKey(r);
    if(k&&!seen.has(k)){ existing.push(r); seen.add(k); added++; }
  });
  return {merged:existing, added};
}

function importCSV(e){
  const f=e.target.files[0]; if(!f) return;
  const tryParse=(txt)=>{
    try{
      const newRows=parseCSV(txt);
      if(newRows.length===0) return false;

      // Load existing rows from localStorage
      let existingRows=[];
      try{ const s=localStorage.getItem('nc_rows'); if(s) existingRows=JSON.parse(s); }catch(ex){}

      const isFirstImport=existingRows.length===0;
      const {merged, added}=mergeRows(existingRows, newRows);

      S.patients=buildPatients(merged);
      try{ localStorage.setItem('nc_rows',JSON.stringify(merged)); }catch(ex){}
      persist();
      document.getElementById('pcnt').textContent=S.patients.length;
      updateBdayCnt();

      if(isFirstImport){
        toast(`✅ ${S.patients.length} pacientes carregados`);
      } else {
        toast(`✅ ${added} novos registros adicionados · ${S.patients.length} pacientes no total`);
      }
      go(isFirstImport?'remarketing':'dashboard');
      return true;
    }catch(ex){ toast('❌ Erro: '+ex.message); console.error(ex); return false; }
  };
  const r1=new FileReader();
  r1.onload=ev=>{
    const txt=ev.target.result;
    // Se UTF-8 gerou caracteres substitutos (arquivo é Windows-1252), usa encoding correto
    if(txt.includes('�')){
      const r2=new FileReader();
      r2.onload=ev2=>tryParse(ev2.target.result);
      r2.readAsText(f,'windows-1252');
    } else {
      tryParse(txt);
    }
  };
  r1.readAsText(f,'utf-8');
}

// ─── SEARCH ───────────────────────────────────────────────────────────────────
function onSearch(v){
  S.q=v.toLowerCase();
  go(S.page);
}

function filt(pts){
  let res=pts;
  if(S.q){
    res=res.filter(p=>
      p.nome.toLowerCase().includes(S.q)||
      p.tel.includes(S.q)||
      p.cpf.includes(S.q)||
      (p.last?.tipo||'').toLowerCase().includes(S.q)
    );
  }
  if(S.period!=='all'){
    const now=new Date();
    res=res.filter(p=>{
      if(!p.last?.data) return false;
      const d=parseDate(p.last.data);
      if(!d) return false;
      const diff=(now-d)/864e5;
      if(S.period==='30') return diff<=30;
      if(S.period==='90') return diff<=90;
      if(S.period==='180') return diff<=180;
      if(S.period==='year') return d.getFullYear()===now.getFullYear();
      return true;
    });
  }
  return res;
}

function filtAtend(pts){
  const all=pts.flatMap(p=>p.atend);
  if(S.period==='all') return all;
  const now=new Date();
  return all.filter(a=>{
    const d=parseDate(a.data);
    if(!d) return false;
    const diff=(now-d)/864e5;
    if(S.period==='30') return diff<=30;
    if(S.period==='90') return diff<=90;
    if(S.period==='180') return diff<=180;
    if(S.period==='year') return d.getFullYear()===now.getFullYear();
    return true;
  });
}

function togglePeriod(){
  const el=document.getElementById('p-opts');
  const trig=document.getElementById('p-trig');
  if(!el || !trig) return;
  const isOpen=el.style.display==='block';
  el.style.display=isOpen?'none':'block';
  trig.classList.toggle('open',!isOpen);
}

function setPeriod(v,lbl){
  S.period=v;
  const labelEl=document.getElementById('p-lbl');
  if(labelEl) labelEl.textContent=lbl;
  document.querySelectorAll('.c-sel-opt').forEach(opt=>opt.classList.toggle('active',opt.dataset.val===v));
  const opts=document.getElementById('p-opts');
  if(opts) opts.style.display='none';
  const trig=document.getElementById('p-trig');
  if(trig) trig.classList.remove('open');
  go(S.page);
}

window.addEventListener('click',e=>{
  if(!e.target.closest('.c-sel')){
    const opts=document.getElementById('p-opts');
    if(opts) opts.style.display='none';
    const trig=document.getElementById('p-trig');
    if(trig) trig.classList.remove('open');
  }
});

function isBdayMonth(id){
  const b=S.birthdates[id]; if(!b) return false;
  const m=parseInt(b.split('/')[1]);
  return m===(new Date().getMonth()+1);
}
function isBdayToday(id){
  const b=S.birthdates[id]; if(!b) return false;
  const now=new Date();
  const [d,m]=b.split('/').map(Number);
  return d===now.getDate() && m===(now.getMonth()+1);
}

function updateBdayCnt(){
  const cnt=thisMonthBdays().length;
  const el=document.getElementById('bday-cnt');
  if(!el) return;
  if(cnt>0){el.textContent=cnt;el.style.display='';}
  else el.style.display='none';
}

function importBdays(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.csv';
  inp.onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const tryImport=txt=>{
      txt=txt.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
      const lines=txt.split('\n').filter(l=>l.trim());
      if(lines.length<2){toast('❌ Arquivo inválido');return;}
      const sep=lines[0].includes(';')?';':',';
      const hdr=lines[0].split(sep).map(h=>h.trim());
      const idCol=hdr.findIndex(h=>h==='ID Amigo'||h==='ID');
      const bdCol=hdr.findIndex(h=>h.includes('Nasc'));
      if(idCol<0||bdCol<0){toast('❌ Colunas "ID Amigo" e "Data Nasc." não encontradas');return;}
      let ok=0,skip=0;
      lines.slice(1).forEach(l=>{
        const cols=l.split(sep).map(c=>c.trim());
        const id=cols[idCol]; const raw=cols[bdCol];
        if(!id||!raw) return;
        const parts=raw.split('/');
        if(parts.length<2) return;
        const ddmm=parts[0].padStart(2,'0')+'/'+parts[1].padStart(2,'0');
        if(!/^\d{2}\/\d{2}$/.test(ddmm)) return;
        const patient=S.patients.find(p=>p.id===id);
        if(!patient){skip++;return;}
        S.birthdates[id]=ddmm; ok++;
      });
      persist();
      refreshBdaySection();
      toast(`✅ ${ok} aniversários importados · ${skip} IDs não encontrados na base`);
    };
    const r=new FileReader();
    r.onload=ev=>{
      const txt=ev.target.result;
      if(txt.includes('Ã')||txt.includes('â€')){
        const r2=new FileReader();
        r2.onload=ev2=>tryImport(ev2.target.result);
        r2.readAsText(f,'windows-1252');
      } else { tryImport(txt); }
    };
    r.readAsText(f,'utf-8');
  };
  inp.click();
}

  const menu=document.getElementById('ctx-menu');
  menu.style.display='block';
  
  let cx = e.clientX;
  let cy = e.clientY;
  if(typeof cx !== 'number') cx = e.touches?.[0]?.clientX || (window.innerWidth / 2);
  if(typeof cy !== 'number') cy = e.touches?.[0]?.clientY || (window.innerHeight / 2);

  const x = Math.max(10, Math.min(cx, window.innerWidth - (menu.offsetWidth || 220) - 10));
  const y = Math.max(10, Math.min(cy, window.innerHeight - (menu.offsetHeight || 300) - 10));
  
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
}

function deletePat(id){
  let rows=[];
  try{ rows=JSON.parse(localStorage.getItem('nc_rows')||'[]'); }catch(e){}
  // Remove all rows belonging to this patient
  const filtered=rows.filter(r=>{
    const raw=r['Paciente']||'';
    const m=raw.match(/^(\d+)/);
    return (m?m[1]:null)!==id;
  });
  localStorage.setItem('nc_rows',JSON.stringify(filtered));
  // Clean up state
  delete S.kanban[id];
  delete S.rmkSent[id];
  delete S.birthdates[id];
  S.patients=buildPatients(filtered);
  persist();
  closeModal();
  toast('🗑️ Paciente removido.');
  if(S.page==='pats') renderPats(1);
}

function saveNewLead(){
  const nome=document.getElementById('lead-nome').value.trim();
  if(!nome){ toast('❌ Nome é obrigatório'); return; }
  const tel=document.getElementById('lead-tel').value.trim();
  const email=document.getElementById('lead-email').value.trim();
  const cpf=document.getElementById('lead-cpf').value.trim();
  const bday=document.getElementById('lead-bday').value.trim();
  const proc=document.getElementById('lead-proc').value.trim()||'Lead';
  const obs=document.getElementById('lead-obs').value.trim();
  const leadId=String(Date.now());
  const today=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
  const newRow={
    'Paciente':`${leadId} - ${nome}`,
    'CPF':cpf,'Telefone':tel,'Email':email,
    'Data do agendamento':today,'Hora':'',
    'Tipo de Atendimento':proc,
    'Status':obs||'Lead',
    'Médico':'','_manual':true
  };
  let rows=[];
  try{ rows=JSON.parse(localStorage.getItem('nc_rows')||'[]'); }catch(e){}
  rows.unshift(newRow);
  localStorage.setItem('nc_rows',JSON.stringify(rows));
  S.kanban[leadId]='entrar';
  if(bday&&bday.match(/^\d{2}\/\d{2}$/)) S.birthdates[leadId]=bday;
  S.patients=buildPatients(rows);
  persist();
  closeModal();
  toast('✅ Lead adicionado!');
  renderPats(1);
}

function exportPats(){
  let csv='Nome;Telefone;Email;CPF;Ultimo Atendimento;Tipo;Status;Total\n';

  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));

}

function renderRmk(){

  let pts=filt(S.patients).filter(p=>(S.kanban[p.id]||'entrar')!=='nao').map(p=>({...p,cat:rmkCat(p.last?.tipo,p.last?.status),dias:daysSince(p.last?.data)}));

  const filtered=S.rmkFilter==='all'?pts:pts.filter(p=>p.cat===S.rmkFilter);
  filtered.sort((a,b)=>{
    const sa=S.rmkSent[a.id]?1:0, sb=S.rmkSent[b.id]?1:0;
    if(sa!==sb) return sa-sb;
    return b.dias-a.dias;

function markSent(id){
  S.rmkSent[id]=true;
  // Advance kanban: move to 2nd stage if currently in 1st (only move forward)
  if(S.stages.length>=2){
    const firstId=S.stages[0].id;
    const secondId=S.stages[1].id;
    const cur=S.kanban[id]||firstId;
    const curIdx=S.stages.findIndex(s=>s.id===cur);
    if(curIdx<=0) S.kanban[id]=secondId;
  }
  persist();
  document.getElementById(`rc-${id}`)?.classList.add('sent');
  // Visual feedback on the badge
  const badge=document.querySelector(`#rc-${id} .kanban-moved`);
  if(!badge){
    const el=document.getElementById(`rc-${id}`);
    if(el){
      const tag=document.createElement('span');
      tag.className='kanban-moved';
      tag.style.cssText='font-size:10.5px;color:#1E40AF;background:#DBEAFE;border-radius:4px;padding:2px 7px;margin-left:6px';
      tag.textContent='📋 Kanban: Em Contato';
      const nameEl=el.querySelector('span[style*="font-weight:600"]');
      if(nameEl) nameEl.after(tag);
    }
  }
}

}

async function sendViaAPI(patientId){
  const p=S.patients.find(x=>x.id===patientId);
  if(!p||!p.tel) return toast('Paciente sem telefone cadastrado');
  const phone=p.tel.replace(/\D/g,'');
  const fullPhone=phone.startsWith('55')?phone:'55'+phone;
  const btn=document.getElementById('apibtn-'+patientId);
  if(btn){ btn.disabled=true; btn.textContent='Enviando...'; }
  try{
    const isTest=(S.waConfig.templateName||'hello_world')==='hello_world';
    const firstName=p.nome.trim().split(' ')[0];
    const tmplBody={
      name:S.waConfig.templateName||'hello_world',
      language:{code:isTest?'en_US':'pt_BR'}
    };
    if(!isTest) tmplBody.components=[{type:'body',parameters:[{type:'text',text:firstName}]}];

    const {data,error}=await SB.functions.invoke('dynamic-responder',{
      body:{to:fullPhone,token:S.waConfig.token,phoneNumberId:S.waConfig.phoneNumberId,templateName:S.waConfig.templateName||'hello_world',patientName:p.nome}
    });
    if(error) throw new Error(error.message||JSON.stringify(error));
    if(!data?.ok) throw new Error(data?.data?.error?.message||data?.error||`Erro ${data?.status}`);
    markSent(patientId);
    toast('✅ Mensagem enviada via API WhatsApp!');
  }catch(e){
    console.error('WA API error:',e);
    toast('❌ '+e.message);
    if(btn){ btn.disabled=false; btn.textContent='Enviar API'; }
  }
}

function kbStart(e,id){ dragId=id; setTimeout(()=>document.getElementById(`kk-${id}`)?.classList.add('drag'),0); e.dataTransfer.setData('text/plain',id); }
function kbEnd(e){ if(dragId) document.getElementById(`kk-${dragId}`)?.classList.remove('drag'); document.querySelectorAll('.kb-col').forEach(c=>c.classList.remove('dov')); dragId=null; }
function kbOver(e,sid){ e.preventDefault(); document.querySelectorAll('.kb-col').forEach(c=>c.classList.remove('dov')); document.getElementById(`kc-${sid}`)?.classList.add('dov'); }
function kbLeave(e){ if(!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove('dov'); }
function playPop(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const t=ctx.currentTime;
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(600,t);
    osc.frequency.exponentialRampToValueAtTime(300,t+0.1);
    gain.gain.setValueAtTime(0.2,t);
    gain.gain.exponentialRampToValueAtTime(0.01,t+0.1);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t+0.1);
  }catch(e){}
}
function kbDrop(e,sid){
  e.preventDefault();
  const id=e.dataTransfer.getData('text/plain')||dragId;
  if(!id) return;
  if(S.kanban[id]!==sid) playPop();
  S.kanban[id]=sid; persist(); renderKanban();
  toast(`✅ Movido para ${S.stages.find(s=>s.id===sid)?.label}`);
}

function calcFunnelData(){
  const pts=filt(S.patients);
  const now=new Date();
  const comTel=pts.filter(p=>p.tel&&p.tel.trim()).length;
  const rmkSentIds=new Set(Object.keys(S.rmkSent).filter(id=>S.rmkSent[id]));
  const rmkSentCnt=rmkSentIds.size;
  // Usa índice em S.stages para calcular progressão
  const stageIdx=id=>{ const i=S.stages.findIndex(s=>s.id===(S.kanban[id]||S.stages[0]?.id)); return i<0?0:i; };
  const n=S.stages.length||6;
  
  const urgente=pts.filter(p=>{ if(!p.last?.data) return false; const d=parseDate(p.last.data); if(!d) return false; return (now-d)/864e5>180; }).length;
  const atencao=pts.filter(p=>{ if(!p.last?.data) return false; const d=parseDate(p.last.data); if(!d) return false; const days=(now-d)/864e5; return days>90&&days<=180; }).length;
  const semTel=pts.filter(p=>!p.tel||!p.tel.trim()).length;
  const pendente=comTel-rmkSentCnt;

  const fStages = [{
    lbl:'TOTAL DE LEADS',
    sub:'Base total de pacientes',
    val:pts.length,
    grad:['#334155','#0F172A'] // Slate/Midnight
  }];

  const activeStages = S.stages.filter(s => s.id !== 'nao');
  const grads = [
      ['#4F46E5','#231C77'], // Indigo
      ['#8B5CF6','#411A8B'], // Purple
      ['#EC4899','#88114A'], // Pink
      ['#F43F5E','#8B0A29'], // Rose
      ['#F59E0B','#854106'], // Amber/Gold
      ['#10B981','#075E43'], // Emerald
      ['#14B8A6','#0C5752']  // Teal
  ];

  activeStages.forEach((st, i) => {
    const count = pts.filter(p => stageIdx(p.id) >= i && S.kanban[p.id] !== 'nao').length;
    fStages.push({
      lbl: st.label.toUpperCase(),
      sub: i===0 ? 'Iniciaram no pipeline' : i===activeStages.length-1 ? 'Etapa final de conversão' : 'Avançaram no pipeline',
      val: count,
      grad: grads[i] || grads[grads.length-1]
    });
  });

  // Backward compatibility variables for bottom stats (using last stage as converted)
  const avancaram = pts.filter(p=>stageIdx(p.id)>=1 && S.kanban[p.id]!=='nao').length;
  const convertidos = pts.filter(p=>stageIdx(p.id)>=activeStages.length-1 && S.kanban[p.id]!=='nao').length;
  const agendados = pts.filter(p=>stageIdx(p.id)>=Math.max(1, activeStages.length-2) && S.kanban[p.id]!=='nao').length;

  return {comTel,rmkSentCnt,avancaram,agendados,convertidos,urgente,atencao,semTel,pendente,fStages,pts};
}

function buildFunnelShapes(fStages,comTel,rowH=78,rowGap=4){
  const maxVal=fStages[0].val||1;
  const widths=fStages.map(s=>s.val===0?3:Math.max(8,s.val/maxVal*100));
  return fStages.map((s,i)=>{
    const wTop=widths[i], wBot=i===fStages.length-1?3:widths[i+1];
    const tl=(100-wTop)/2, tr=(100+wTop)/2, bl=(100-wBot)/2, br=(100+wBot)/2;
    const prev=fStages[i-1];
    const dropPct=prev&&prev.val>0?(s.val/prev.val*100):100;
    const ofBase=comTel>0?(s.val/comTel*100):0;
    const isLast=i===fStages.length-1;
    return`<div style="display:flex;align-items:center;margin-bottom:${isLast?0:rowGap}px;height:${rowH}px">
      <div style="flex:0 0 58%;height:100%;
        clip-path:polygon(${tl.toFixed(2)}% 0%,${tr.toFixed(2)}% 0%,${br.toFixed(2)}% 100%,${bl.toFixed(2)}% 100%);
        background:linear-gradient(160deg,${s.grad[0]} 0%,${s.grad[1]} 100%);
        filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))"></div>
      <div style="flex:1;display:flex;align-items:center;gap:10px;padding-left:14px">
        <div style="width:8px;height:8px;border-radius:50%;background:${s.grad[0]};flex-shrink:0;box-shadow:0 0 0 3px ${s.grad[0]}33"></div>
        <div>
          <div style="font-size:10.5px;font-weight:800;color:var(--txt2);letter-spacing:1px">${s.lbl}</div>
          <div style="font-size:22px;font-weight:900;color:${s.grad[0]};line-height:1.1">${s.val.toLocaleString('pt-BR')}</div>
          <div style="font-size:10px;margin-top:1px">${i===0?`<span style="color:var(--txt3)">100% da base</span>`:dropPct<100?`<span style="color:#F87171">▼ ${(100-dropPct).toFixed(0)}% drop · ${ofBase.toFixed(1)}% da base</span>`:`<span style="color:#34D399">= sem perda</span>`}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderFunnel(){
  const {comTel,rmkSentCnt,avancaram,agendados,convertidos,urgente,atencao,semTel,pendente,fStages,pts}=calcFunnelData();

  const total=pts.length;

  const all=filtAtend(S.patients);
  const tbreak={};
  all.forEach(a=>{
    if(!a.tipo) return;
    if(!tbreak[a.tipo]) tbreak[a.tipo]={t:0,c:0,x:0,f:0};
    tbreak[a.tipo].t++;
    const s=(a.status||'').toLowerCase();
    if(s==='confirmado') tbreak[a.tipo].c++;
    else if(s==='cancelou') tbreak[a.tipo].x++;
    else if(s==='faltou') tbreak[a.tipo].f++;
  });
  const topT=Object.entries(tbreak).sort((a,b)=>b[1].t-a[1].t).slice(0,10);

  const funnelHtml=buildFunnelShapes(fStages,total);

  document.getElementById('view').innerHTML=`
  <div style="display:grid;grid-template-columns:500px 1fr;gap:20px;align-items:start">

    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card" style="border:1px solid rgba(201,168,76,.3)">
        <div style="font-size:16px;font-weight:700;color:var(--gold);margin-bottom:4px">Funil de Vendas</div>
        <div style="font-size:11.5px;color:var(--txt3);margin-bottom:20px">Jornada de todos os pacientes no Kanban</div>
        ${funnelHtml}
        <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--bord);display:flex;gap:20px">
          <div>
            <div style="font-size:10.5px;color:var(--txt3)">Conversão Total da Base</div>
            <div style="font-size:18px;font-weight:700;color:var(--gold)">${total>0?(convertidos/total*100).toFixed(1):0}%</div>
          </div>
          <div>
            <div style="font-size:10.5px;color:var(--txt3)">Taxa de Avanço (Pipeline Ativo)</div>
            <div style="font-size:18px;font-weight:700;color:#34D399">${total>0?(avancaram/total*100).toFixed(1):0}%</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div style="font-size:14px;font-weight:600;color:var(--gold);margin-bottom:12px">Oportunidades na Base</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          ${[
            {lbl:'Urgente',val:urgente,sub:'>180d sem retorno',bg:'rgba(239,68,68,.12)',tc:'#F87171'},
            {lbl:'Atenção',val:atencao,sub:'90–180d · janela ideal',bg:'rgba(245,158,11,.12)',tc:'#FBBF24'},
            {lbl:'Pendente',val:pendente,sub:'Com tel · aguardando envio',bg:'rgba(201,168,76,.1)',tc:'var(--gold)'},
            {lbl:'Sem telefone',val:semTel,sub:'Fora do alcance WA',bg:'rgba(255,255,255,.04)',tc:'var(--txt3)'},
          ].map(s=>`<div style="background:${s.bg};border-radius:10px;padding:12px">
            <div style="font-size:21px;font-weight:800;color:${s.tc};line-height:1">${s.val.toLocaleString('pt-BR')}</div>
            <div style="font-size:12px;font-weight:600;color:${s.tc};margin-top:3px">${s.lbl}</div>
            <div style="font-size:10px;color:var(--txt3);margin-top:2px">${s.sub}</div>
          </div>`).join('')}
        </div>
      </div>
    </div>

    <div class="card">
      <div style="font-size:16px;font-weight:700;color:var(--gold);margin-bottom:4px">Conversão por Procedimento</div>
      <div style="font-size:11.5px;color:var(--txt3);margin-bottom:16px">Taxa de confirmação histórica por tipo de atendimento</div>
      <div style="overflow-y:auto;max-height:620px;padding-right:4px">
        ${topT.map(([tipo,d])=>{
          const taxa=d.t>0?(d.c/d.t*100):0;
          const cor=taxa>=70?'#34D399':taxa>=50?'#FBBF24':'#F87171';
          return`<div style="margin-bottom:14px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;flex-wrap:wrap;gap:4px">
              <span style="font-size:12.5px;color:var(--txt);font-weight:600;flex:1">${tipo}</span>
              <div style="display:flex;gap:8px;align-items:center;flex-shrink:0">
                <span style="font-size:10.5px;color:var(--txt3)">${d.t} total</span>
                <span style="font-size:10.5px;color:#34D399">✓${d.c}</span>
                <span style="font-size:10.5px;color:#F87171">✗${d.x}</span>
                <span style="font-size:11.5px;font-weight:700;color:${cor};background:${cor}22;padding:2px 8px;border-radius:5px">${taxa.toFixed(0)}%</span>
              </div>
            </div>
            <div style="background:var(--surf3);height:8px;border-radius:4px;overflow:hidden">
              <div style="background:${cor};height:8px;border-radius:4px;width:${taxa}%;transition:width 1s"></div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>

  </div>`;
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function init(){
  await loadPersist();
  // Migrate old stage IDs to new ones
  const migrate={'lead':'entrar','conf':'retornou','agend':'agend'};
  Object.keys(S.kanban).forEach(id=>{
    if(migrate[S.kanban[id]]) S.kanban[id]=migrate[S.kanban[id]];
  });
  if(S.patients.length) document.getElementById('pcnt').textContent=S.patients.length;
  updateBdayCnt();
  go('dashboard');
}

init();
</script>
</body>
</html>
